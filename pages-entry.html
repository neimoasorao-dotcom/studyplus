    <script>(function applyColorMode(next) {
	let mode = next ?? "system";
	if (!next) try {
		const saved = localStorage.getItem("studyplus.colorMode");
		if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
	} catch {}
	let systemDark = false;
	try {
		systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
	} catch {}
	const resolved = mode === "dark" || mode === "system" && systemDark ? "dark" : "light";
	const root = document.documentElement;
	root.classList.toggle("dark", resolved === "dark");
	root.dataset.colorMode = mode;
	root.dataset.resolvedColorMode = resolved;
	root.style.colorScheme = resolved;
	return {
		mode,
		resolved
	};
})()</script>
